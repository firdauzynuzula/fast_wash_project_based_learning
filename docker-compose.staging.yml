services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-fast_wash_staging}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-staging_secret_pass}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-https://staging.gapunyaide.web.id}
      - NOTA_BASE_URL=${NOTA_BASE_URL:-https://staging-nota.gapunyaide.web.id}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL:-support@gapunyaide.web.id}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Fast Wash Official}
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fast_wash_staging}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-staging_secret_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fast_wash_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - pgdata_staging_v17:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata_staging_v17:
