services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-fast_wash_prod}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-prod_ultra_secure_pass}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://fastwash.web.id}
      - NOTA_BASE_URL=${NOTA_BASE_URL:-https://nota.fastwash.web.id}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL:-support@fastwash.web.id}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Fast Wash Official}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fast_wash_prod}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-prod_ultra_secure_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./sql/01_master_dan_identitas.sql:/docker-entrypoint-initdb.d/01_master_dan_identitas.sql:ro
      - ./sql/02_pengguna_dan_autentikasi.sql:/docker-entrypoint-initdb.d/02_pengguna_dan_autentikasi.sql:ro
      - ./sql/03_pesanan_dan_transaksi.sql:/docker-entrypoint-initdb.d/03_pesanan_dan_transaksi.sql:ro
      - ./sql/04_absensi_dan_log.sql:/docker-entrypoint-initdb.d/04_absensi_dan_log.sql:ro
      - ./sql/05_indeks_dan_trigger.sql:/docker-entrypoint-initdb.d/05_indeks_dan_trigger.sql:ro
      - ./sql/06_views_antarmuka.sql:/docker-entrypoint-initdb.d/06_views_antarmuka.sql:ro
      - ./sql/07_data_awal_seed.sql:/docker-entrypoint-initdb.d/07_data_awal_seed.sql:ro

volumes:
  pgdata_prod:
