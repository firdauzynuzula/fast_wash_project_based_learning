<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f6fd">
    <title>Fast Wash | Handled with care</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="font-jakarta bg-slate-100 antialiased">
    <!-- Splash screen pelanggan -->
    <main class="relative mx-auto flex min-h-screen max-w-md flex-col items-center justify-center overflow-hidden bg-linear-to-b from-[#f1f6fd] via-[#e9f2fc] to-[#deebf9] px-6">

        <!-- Cahaya lembut di belakang ilustrasi -->
        <div class="pointer-events-none absolute inset-x-[-20%] top-[28%] h-[30%] rounded-full bg-[#cfe5fb] blur-3xl" aria-hidden="true"></div>

        <!-- Gelembung & aksen dekoratif -->
        <span class="pointer-events-none absolute right-[8%] top-[25%] h-4 w-3 rounded-full bg-[#b1dbfc] blur-[1px]" aria-hidden="true"></span>
        <span class="pointer-events-none absolute right-[10%] top-[33%] h-6 w-3 rotate-12 rounded-full bg-[#a5d9d0]/80 blur-[1px]" aria-hidden="true"></span>
        <span class="pointer-events-none absolute left-[27%] top-[30%] size-3 rounded-full bg-[#c1ede9] blur-[1px]" aria-hidden="true"></span>
        <span class="pointer-events-none absolute left-[9%] top-[50%] h-7 w-4 -rotate-12 rounded-full bg-[#b1dcdf]/80 blur-[1px]" aria-hidden="true"></span>
        <span class="pointer-events-none absolute left-[22%] top-[61%] size-3.5 rounded-full border border-white/70 bg-[#cfe5fb]" aria-hidden="true"></span>
        <span class="pointer-events-none absolute right-[24%] top-[60%] size-5 rounded-full border border-white/70 bg-[#d7eafc]" aria-hidden="true"></span>
        <span class="pointer-events-none absolute right-[16%] top-[38%] size-7 rounded-full border border-white/80 bg-white/30" aria-hidden="true"></span>

        <!-- Konten utama -->
        <div class="relative z-10 flex flex-col items-center text-center">
            <img src="../assets/img/laundry-illustration.webp"
                 alt="Ilustrasi mesin cuci, keranjang pakaian, dan handuk terlipat"
                 width="384" height="384"
                 class="w-64 drop-shadow-xl motion-safe:animate-float sm:w-72">

            <h1 class="mt-16 text-4xl font-extrabold tracking-tight text-[#0067c3] motion-safe:animate-fade-up">
                Fast Wash
            </h1>
            <p class="mt-2 text-base font-medium text-[#5b6b82] motion-safe:animate-fade-up motion-safe:[animation-delay:200ms]">
                Handled with care
            </p>
        </div>

        <!-- Indikator memuat -->
        <div class="absolute bottom-14 z-10 flex gap-1.5" role="status" aria-label="Memuat halaman">
            <span class="size-2 rounded-full bg-[#0067c3]/70 motion-safe:animate-pulse"></span>
            <span class="size-2 rounded-full bg-[#0067c3]/50 motion-safe:animate-pulse motion-safe:[animation-delay:200ms]"></span>
            <span class="size-2 rounded-full bg-[#0067c3]/30 motion-safe:animate-pulse motion-safe:[animation-delay:400ms]"></span>
        </div>
    </main>

    <script>
        // Splash screen: lanjut ke dashboard pelanggan setelah beberapa detik.
        setTimeout(function () {
            window.location.href = 'pesanan.html';
        }, 2500);
    </script>
</body>
</html>
